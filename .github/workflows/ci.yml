name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    uses: johnhenry/workflows/.github/workflows/ci.yml@v1
    with:
      node-versions: '["26"]'
      os: '["ubuntu-latest"]'
      gate-commands: |
        npx playwright install --with-deps
        npm run lint
        npm run typecheck
        npm run build
        npm test
        npm run test:dist
        npm run examples
        npm pack --dry-run
