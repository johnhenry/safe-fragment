name: Publish to npm

on:
  release:
    types: [published]
  push:
    # Redundant with the release trigger above -- see fileable's
    # publish.yml / johnhenry/workflows' README for the full incident
    # writeup: creating a release very soon after a push/merge to the
    # same commit can silently drop the release event for a job whose
    # body is uses: <external-repo>/...@v1. This gives a second,
    # idempotency-safe chance to fire.
    tags:
      - "v*"
  workflow_dispatch: {}

# Releases fire twice: `release: published`, and the tag push it creates.
# Queue the second run (never cancel it) so its `npm view` guard sees the
# version the first one published and exits cleanly, instead of both runs
# publishing at once and one failing (E403/E409). This is not the CI
# concurrency-cancel block: publish runs must never be cancelled.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: read
      id-token:
        write # required by the reusable workflow's provenance step --
        # see johnhenry/workflows' README for why this must be declared here too.
    # The reusable workflow runs ONLY the gate-commands below (it has no gate of
    # its own) and then `npm publish`. Keep this list identical to ci.yml's: the
    # publish gate must be the full suite (lint, typecheck, build, all three
    # browsers via `npm test`, test:dist, examples, pack, size budget, JSR dry run).
    uses: johnhenry/workflows/.github/workflows/npm-publish.yml@v1
    with:
      node-version: "26"
      gate-commands: |
        npx playwright install --with-deps
        npm run lint
        npm run typecheck
        npm run build
        npm test
        npm run test:dist
        npm run examples
        npm pack --dry-run
        npm run size
        npx --yes jsr publish --dry-run --allow-dirty
    secrets: inherit
