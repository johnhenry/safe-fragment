name: Publish to npm

# Publish model: main is the release branch. A push to main publishes only if
# package.json's version isn't on npm yet (otherwise a clean no-op), then tags
# v<version> and creates a GitHub Release. See johnhenry/workflows' README.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write # tag + GitHub Release by-product of npm-publish.yml
      id-token: write # npm provenance
    # The reusable workflow runs ONLY the gate-commands below (it has no gate of
    # its own) and then `npm publish`. Keep this list identical to ci.yml's: the
    # publish gate must be the full suite (lint, typecheck, build, all three
    # browsers via `npm test`, test:dist, examples, pack, size budget, JSR dry run).
    uses: johnhenry/workflows/.github/workflows/npm-publish.yml@v1
    with:
      node-version: "26"
      gate-commands: |
        npx playwright install --with-deps
        npm run lint
        npm run typecheck
        npm run build
        npm test
        npm run test:dist
        npm run examples
        npm pack --dry-run
        npm run size
        npx --yes jsr publish --dry-run --allow-dirty
    secrets: inherit
